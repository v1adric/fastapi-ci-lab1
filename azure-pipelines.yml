trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Назва створеного Service Connection у Azure DevOps
  dockerRegistryServiceConnection: 'DockerHubConnection'
  # Логін_DockerHub/Назва_Репозиторію
  imageRepository: 'vladik2929/fastapi-items-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: 'latest'

stages:
  # Етап 1: Перевірка коду та запуск Unit-тестів
  - stage: Test
    displayName: 'Run Unit Tests'
    jobs:
      - job: Pytest
        displayName: 'Run pytest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Use Python 3.11'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install Dependencies'

          - script: |
              pytest
            displayName: 'Execute pytest'

  # Етап 2: Збірка Docker-образу та пуш у Docker Hub
  - stage: BuildAndPush
    displayName: 'Build and Push Docker Image'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: DockerBuild
        displayName: 'Build and Push to Docker Hub'
        steps:
          - task: Docker@2
            displayName: 'Build and Push image'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)